# The Xcode project, generated by XcodeGen (brew install xcodegen): run `xcodegen` here, then open Bulbula.xcodeproj.
name: Bulbula
options:
  bundleIdPrefix: et.bulbula
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The site the app reads from. For a local site: xcodebuild … SITE_URL=http://localhost:3000
    SITE_URL: https://bulbula-directory.vercel.app
targets:
  Bulbula:
    type: application
    platform: iOS
    sources: [Bulbula]
    info:
      path: Bulbula/Info.plist
      properties:
        CFBundleDisplayName: Bulbula
        CFBundleDevelopmentRegion: en
        # The site's languages; iOS Settings → Bulbula → Language switches between them.
        CFBundleLocalizations: [en, am]
        BulbulaSiteURL: $(SITE_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Sets a place's pin where you stand.
        # Plain http only for a site on this computer (development); everything else is https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        # bulbula://place/<slug>, bulbula://settings … open a screen directly (handy for testing and agents).
        CFBundleURLTypes:
          - CFBundleURLName: et.bulbula.directory
            CFBundleURLSchemes: [bulbula]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: et.bulbula.directory
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  BulbulaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BulbulaTests
      # The same trimmed copy of /en/directory.json the Android tests read.
      - path: ../android/app/src/test/resources/directory-sample.json
        buildPhase: resources
    dependencies:
      - target: Bulbula
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Bulbula:
    build:
      targets:
        Bulbula: all
    test:
      targets: [BulbulaTests]
